; One env per entrypoint in src/. Build/upload with: pio run -e <name> -t upload (the page in ../software is included automatically)
[platformio]
default_envs = carController

[env]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
build_unflags     = -std=gnu++14
build_flags       = -std=gnu++17
upload_speed      = 921600
lib_extra_dirs    = lib
lib_deps          = links2004/WebSockets @ ^2.4.1
                    madhephaestus/ESP32Servo @ ^3.0.5
extra_scripts     = pre:tools/embedWeb.py ; bakes ../software/ into the firmware

[env:carController]
build_src_filter = -<*> +<carController.cpp>

[env:calibration]
build_src_filter = -<*> +<calibration.cpp>

[env:controllerVerification]
build_src_filter = -<*> +<controllerVerification.cpp>
